# render.yaml — Render blueprint for the Infy Voice demo.
# Lives at the repo root (Render reads blueprints from here); the app itself
# sits in upal_version_infy_voice/, which is what rootDir points at.
#
# Sizing note: the local GGUF model (~2.5GB) does not fit on Render
# free/entry plans — this runs the Gemini paths: VOICE_MODE=live plus
# LLM_PROVIDER=gemini as cascade fallback. No model download needed.
# The SQLite DB is seeded on first boot by the start command.
#
# Node note: Render's native Python runtime ships without node/npm, so the
# build downloads a standalone Node 20 tarball to compile the Vite frontend.
services:
  - type: web
    name: ytann-infy-voice
    runtime: python
    plan: free
    rootDir: upal_version_infy_voice
    buildCommand: "curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz -o /tmp/node.tar.xz && mkdir -p /tmp/node && tar -xJf /tmp/node.tar.xz -C /tmp/node --strip-components=1 && export PATH=/tmp/node/bin:$PATH && cd frontend && npm ci && npm run build && cd .. && pip install -r requirements-render.txt"
    startCommand: "test -f varad.db || python seed_db.py; python backend.py"
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VOICE_MODE
        value: live
      - key: LLM_PROVIDER
        value: gemini
      - key: TTS_PROVIDER
        value: edge
      - key: LIVE_MAX_SESSION_MINUTES
        value: "10"
      - key: PYTHON_VERSION
        value: "3.13.1"
